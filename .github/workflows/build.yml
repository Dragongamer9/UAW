name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          # Ubuntu 22.04 (glibc 2.35) so the Linux build also runs on Debian 12 based systems
          # (Peppermint, Hearth OS Peppermint edition) and anything newer.
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # GCC 13 (the compiler the code is developed with) from the toolchain PPA; its C++ runtime
          # is linked in statically below, so only glibc 2.35 is needed at run time.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          extra=""
          # Linux: the C++ runtime linked in, so the binary doesn't depend on the system's libstdc++.
          if [ "$RUNNER_OS" = Linux ]; then extra="-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${extra:+"$extra"}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          for t in uaw-viewer megtool objdump alotool maptool simtool; do
            for f in build/Release/$t.exe build/$t; do
              [ -f "$f" ] && cp "$f" dist/
            done
          done
          cp README.md dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: uaw-native-${{ matrix.name }}
          path: dist/

  release:
    # Tags (v0.1.0, ...) publish a GitHub release with both builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          chmod +x uaw-native-linux-x64/* || true
          mv uaw-native-linux-x64 "uaw-native-${GITHUB_REF_NAME}-linux-x64"
          tar czf "../uaw-native-${GITHUB_REF_NAME}-linux-x64.tar.gz" "uaw-native-${GITHUB_REF_NAME}-linux-x64"
          mv uaw-native-windows-x64 "uaw-native-${GITHUB_REF_NAME}-windows-x64"
          zip -qr "../uaw-native-${GITHUB_REF_NAME}-windows-x64.zip" "uaw-native-${GITHUB_REF_NAME}-windows-x64"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "uaw-native $GITHUB_REF_NAME" \
            --notes "Skirmish build of the Universe at War engine reimplementation. Needs your own copy of the game. Linux: extract, then run ./uaw-viewer \"/path/to/Universe At War Earth Assault\" (or put it in the game folder and run it with no arguments). Windows: extract into the game folder and double-click uaw-viewer.exe. See README.md." \
            uaw-native-*-linux-x64.tar.gz uaw-native-*-windows-x64.zip
